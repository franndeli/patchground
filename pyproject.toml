[project]
name = "patchground"
version = "0.0.1"
description = "Local-first CLI for practicing real software engineering on broken repositories."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Fran Delicado" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "ruamel.yaml>=0.18.10",
    "docker>=7.1",
    "junitparser>=4.0",
    "defusedxml>=0.7.1",
    "requests>=2.32",
    "urllib3>=2.0",
]

[project.optional-dependencies]
# AI SDKs arrive with the experimental debrief (M3); the core never imports them.
ai = []

[project.scripts]
patchground = "patchground.cli.app:main"
pgnd = "patchground.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-docker>=7.1",
    "types-defusedxml>=0.7",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchground"]
exclude = ["**/SPEC.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["examples", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

[tool.mypy]
python_version = "3.12"
files = ["src/patchground"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["patchground.spec.*", "patchground.verify.*", "patchground.sandbox.*", "patchground.sessions.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["docker: needs a reachable Docker engine (integration)"]
