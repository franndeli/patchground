name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "examples/*/challenge.yaml", "registry/*.json", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "examples/*/challenge.yaml", "registry/*.json", ".github/workflows/web.yml"]

permissions:
  contents: read

jobs:
  static-site:
    name: public site checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - name: build from examples/*/challenge.yaml + registry, then test the output
        run: npm --prefix web test
