name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: lint, types, unit tests, schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not docker"
      - name: exported schema is up to date
        run: |
          uv run python -m patchground.spec.schema schema
          test -z "$(git status --porcelain -- schema/)" || { git status --porcelain -- schema/; echo "schema/ is stale: run 'uv run python -m patchground.spec.schema schema'"; exit 1; }

  docker:
    name: docker integration, validate examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m docker
      - name: every example passes pgnd validate
        run: |
          set -e
          for dir in examples/*/; do
            echo "::group::validate $dir"
            uv run pgnd validate "$dir"
            echo "::endgroup::"
          done
