name: release

# Publishes a version tag (vX.Y.Z) as a GitHub release and a PyPI package.
# Nothing here runs on ordinary pushes. Both publishing jobs use protected environments
# (`release`, `pypi`) that must require a maintainer's approval; see docs/publishing.md.
# PyPI uses trusted publishing (OIDC): no API token is stored anywhere.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.12"
      - name: tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv run --no-project python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match pyproject version $version"; exit 1; }
      - run: uv sync --locked
      - run: uv run pytest -q -m "not docker"
      - run: uv build --out-dir dist
      - name: installed wheel runs, without AI SDKs
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv venv --python 3.12 /tmp/verify
          uv pip install --python /tmp/verify/bin/python dist/*.whl
          /tmp/verify/bin/pgnd --version | grep -F "${TAG#v}"
          (cd /tmp && /tmp/verify/bin/pgnd list --builtin --json) | grep -F '"pagination-last-page"'
          ! /tmp/verify/bin/python -c "import anthropic" 2>/dev/null
          ! /tmp/verify/bin/python -c "import litellm" 2>/dev/null
      - name: checksums
        run: (cd dist && sha256sum -- * > ../SHA256SUMS) && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            SHA256SUMS
          retention-days: 30

  github-release:
    name: GitHub release (approval required)
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: create the release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
          gh release create "$TAG" dist/* SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --title "Patchground ${TAG#v}" --notes-file notes.md --verify-tag

  pypi:
    name: PyPI (approval required)
    needs: github-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/patchground/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
