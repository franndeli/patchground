title: Split the monthly sales report into domain, storage and presentation layers
type: architecture
summary: >-
  One function reads SQLite, applies the refund rules and formats text, so nobody can reuse the
  totals or test them without a database. Separate a pure domain core from storage and
  presentation without changing a byte of the report.
