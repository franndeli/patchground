hints:
  - Search billing/ for every use of the SDK, not just the imports. Codes, PsTimeout, ts_ms and the stored response are all vendor vocabulary.
  - Write the port first, in billing's words. What does collect() need to know after a charge? An outcome, a reason, a reference and a time. None of them is a Paysafe code.
  - Dunning reads last_response.rc today. Once the invoice stores billing's reason instead, which of today's dunning rules can be expressed without the SDK?
