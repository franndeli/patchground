title: Keep the payment vendor's SDK out of the billing domain
type: architecture
summary: >-
  Paysafe response codes, timestamps and response objects leak into invoices and dunning, so a
  vendor upgrade touches every billing rule. Build an anti-corruption layer that translates the
  SDK into billing's own payment port without changing a single outcome.
